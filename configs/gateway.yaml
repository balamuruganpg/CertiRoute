# Paths are relative to the repository root; start the app from that directory.
models:
  cheap:
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-20b
    api_key_env: CHEAP_API_KEY
  strong:
    base_url: https://api.x.ai/v1
    model: grok-4.20-0309-non-reasoning
    api_key_env: XAI_API_KEY
calibration:
  artifact: artifacts/calibration.json
  allowed_epsilons: [0.01, 0.02, 0.05, 0.10]
  default_epsilon: 0.02
router:
  kind: logistic_surface_v1
  artifact: artifacts/router.json
scope:
  max_chars: 16000
  temperature: 0
  max_tokens: 256
  top_p: 1
quality_metric:
  name: exact_match
  version: "1"
audit:
  sample_rate: 0.02
safety:
  fail_open_to: strong
  log_prompt_text: false
