[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "certiroute"
version = "0.0.1"
description = "OpenAI-compatible LLM gateway with conformal risk control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6,<7"]
plots = ["matplotlib==3.10.8", "numpy==2.2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"certiroute.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "eval"]

[[tool.mypy.overrides]]
module = ["eval.plot_sensitivity", "eval.plot_shift", "eval.plot_expansion", "eval.plot_portfolio"]
# Missing-import guards are needed when optional plotting packages are absent.
warn_unused_ignores = false
